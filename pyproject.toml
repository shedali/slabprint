[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nemonic"
version = "0.1.0"
description = "Print to a MangoSlab nemonic sticky-note printer, with no vendor driver"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Franz Sittampalam" }]
keywords = ["thermal-printer", "escpos", "eink", "sticky-notes", "nemonic", "mangoslab"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Printing",
]
dependencies = [
  "pillow>=10",
  "pyusb>=1.2",
  "bleak>=0.21",
]

[project.scripts]
nemonic = "nemonic.cli:run"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.7"]

[project.urls]
Homepage = "https://github.com/shedali/nemonic"
Documentation = "https://github.com/shedali/nemonic/blob/master/PROTOCOL.md"

[tool.hatch.build.targets.wheel]
packages = ["src/nemonic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Strict by intent. If a rule here is wrong for this project, turn it off
# explicitly with a reason rather than leaving violations lying around.
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # import sorting
  "UP",        # pyupgrade
  "B",         # bugbear
  "C4",        # comprehensions
  "SIM",       # simplify
  "RUF",       # ruff's own
  "A",         # shadowing builtins
  "T20",       # no stray print() ... except the CLI, see per-file below
  "ARG",       # unused arguments
  "PTH",       # prefer pathlib
]

[tool.ruff.lint.per-file-ignores]
# The CLI and the server report to the user on stdout; that is their job.
"src/nemonic/cli.py" = ["T20"]
"src/nemonic/server.py" = ["T20"]
"src/nemonic/core.py" = ["T20"]
# The queue runs unattended, so it reports skipped jobs on stderr rather than
# failing silently.
"src/nemonic/jobs.py" = ["T20"]
"tests/*" = ["ARG"]
